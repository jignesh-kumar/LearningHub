name: CI | Create a Conan package test for LearningHub on Windows

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install Conan
      run: |
        python -m pip install --upgrade pip
        python -m pip install conan==2.11.0
      
    - name: Detect Conan profile
      run: |
        python -m conan profile detect

    - name: Create a Conan package for LearningHub
      run: |
        python -m conan create . --build=missing -u
