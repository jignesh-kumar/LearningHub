name: CI | Create a Conan package test for LearningHub on Windows

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5  # Changed from v4 to v5 to resolve Node.js deprecation warnings
      with:
        python-version: '3.x'

    - name: Install Conan
      run: |
        python -m pip install --upgrade pip
        python -m pip install --upgrade conan  # Removed hardcoded 2.11.0 to ensure the latest compiler settings are recognized
        conan --version
        where conan || where conan.exe || echo "conan not found on PATH"
      
    - name: Detect Conan profile
      run: conan profile detect --force

    - name: Create a Conan package for LearningHub
      # Added :h (host) and :b (build) context flags to strictly enforce MSVC and bypass auto-detected GCC/Clang
      run: conan create . --build=missing -u -s:h compiler=msvc -s:h compiler.version=193 -s:h compiler.runtime=dynamic -s:h compiler.runtime_type=Release -s:h compiler.cppstd=14 -s:h os=Windows -s:h build_type=Release -s:b compiler=msvc -s:b compiler.version=193
