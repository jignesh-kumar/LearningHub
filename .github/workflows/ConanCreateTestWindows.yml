name: CI | Create a Conan package test for LearningHub on Windows

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install Conan
      run: |
        python -m pip install --upgrade pip
        python -m pip install conan==2.11.0
        conan --version
        where conan || where conan.exe || echo "conan not found on PATH"
      
    - name: Setup Conan profile for Windows
      run: |
        conan profile detect --force
        conan profile update settings.compiler=msvc default
        conan profile update settings.compiler.version=193 default
        conan profile update settings.compiler.runtime=dynamic default
        conan profile update settings.compiler.runtime_type=Release default
        conan profile update settings.compiler.cppstd=14 default
        conan profile show default

    - name: Create a Conan package for LearningHub
      run: |
        conan create . --build=missing -u
