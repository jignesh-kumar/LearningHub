name: CI | Conan Build Test On Windows

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    
    - name: Install Conan
      run: |
        python -m pip install --upgrade pip
        python -m pip install --upgrade conan
        conan --version
        where conan || where conan.exe || echo "conan not found on PATH"

    - name: Detect Conan profile
      run: conan profile detect --force

    - name: Install the requirements specified in a Conan recipe
      run: conan install . -of buildwindows --build missing -u -s:h compiler=msvc -s:h compiler.version=193 -s:h compiler.runtime=dynamic -s:h compiler.runtime_type=Release -s:h compiler.cppstd=14 -s:h os=Windows -s:h build_type=Release -s:b compiler=msvc -s:b compiler.version=193
    
    - name: Build using Conan
      # Added the exact same host and build flags to ensure CMake targets the VS 2022 generator
      run: conan build . -of buildwindows -s:h compiler=msvc -s:h compiler.version=193 -s:h compiler.runtime=dynamic -s:h compiler.runtime_type=Release -s:h compiler.cppstd=14 -s:h os=Windows -s:h build_type=Release -s:b compiler=msvc -s:b compiler.version=193
